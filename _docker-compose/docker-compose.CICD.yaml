# 获取管理员初始密码：
# docker exec jenkins cat /var/jenkins_home/secrets/initialAdminPassword
version: '3.8'

services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    restart: unless-stopped
    user: root # 使用 root 用户以避免权限问题
    ports:
      - "8080:8080" # Jenkins Web界面
      - "50000:50000" # Jenkins代理API端口
    volumes:
      - ./私服/jenkins_home:/var/jenkins_home # 使用命名卷持久化Jenkins数据
    environment:
      - JENKINS_OPTS=--prefix=/jenkins
      - JAVA_OPTS=-Duser.language=zh -Duser.country=CN # 修正中文语言设置
    networks:
      - fullstack-network

  # GitLab Runner用于CI/CD自动构建
  gitlab-runner:
    image: gitlab/gitlab-runner:latest
    container_name: gitlab-runner
    restart: unless-stopped
    volumes:
      - ./私服/gitlab-runner/config:/etc/gitlab-runner # 持久化配置
      - /var/run/docker.sock:/var/run/docker.sock # 允许Docker in Docker
    environment:
      - TZ=Asia/Shanghai
    networks:
      - fullstack-network

  # Node.js构建环境
  node-builder:
    image: node:18-alpine
    container_name: node-builder
    restart: "no" # 仅在需要时启动
    volumes:
      - ./私服/node-builder:/home/node/app # 持久化构建目录
      - ./私服/node-builder/.npm:/home/node/.npm # 缓存npm包
    working_dir: /home/node/app
    environment:
      - NODE_ENV=development
      - NPM_CONFIG_REGISTRY=http://repo-npm-verdaccio:4873 # 使用私有NPM仓库
    networks:
      - fullstack-network

# volumes:
#   jenkins_home:
#     driver: local

networks:
  fullstack-network:
    driver: bridge # 创建本地网络而不是引用外部网络
