<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的浏览器首页</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body,
      html {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { initTabHome } from './src/index.ts';

      // 初始化标签页
      window.addEventListener('DOMContentLoaded', () => {
        initTabHome({
          container: '#app',
          config: {
            weatherEnabled: true,
            searchEnabled: true,
          },
        });
      });
    </script>
  </body>
</html>
